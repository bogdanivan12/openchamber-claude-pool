# The bundle freshness check (`check:bundles`) runs on macOS only: Bun.build can embed
# OS-specific path comments and Windows checkouts may rewrite line endings, so a rebuild on
# Windows would report false stale bundles. The committed bundles are built on macOS.
# Everything else runs on both macOS and Windows.
name: ci
on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test:shared
      # The fork's plugin tests build fake `claude` shell scripts (#!/bin/sh + chmod) and use
      # POSIX symlinks, so the full suite runs on macOS only; Windows runs the pool-specific
      # tests, the bundle load check and the Windows CLI test.
      - run: bun run test:plugin
        if: runner.os == 'macOS'
      - run: bun run test:plugin:windows
        if: runner.os == 'Windows'
      - run: bun run check:bundles
        if: runner.os == 'macOS'
      - run: bunx openchamber-guest-check .
