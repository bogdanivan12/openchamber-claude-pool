<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Claude Pool</title>
    <style>
      html, body { margin: 0; }
      #root { position: relative; padding: 2px 0; font-size: .85em; }
      .list { display: flex; flex-direction: column; gap: 10px; min-width: 0; padding-right: 1.4em; }
      .row { display: flex; flex-direction: column; gap: 4px; }
      .head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; min-width: 0; }
      .who { display: flex; align-items: center; gap: .5em; min-width: 0; }
      .dot { flex: none; width: .55em; height: .55em; border-radius: 50%; }
      .dot.use { background: var(--status-success, #3a7); }
      .dot.ready { background: transparent; box-shadow: inset 0 0 0 1.5px var(--surface-muted-foreground, #888); }
      .dot.out { background: var(--status-error, #d33); }
      .name { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .active { font-weight: 600; }
      .note { flex: none; opacity: .8; }
      .win { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding-left: 1.4em; }
      .win-label { display: flex; gap: .4em; align-items: baseline; }
      .win-reset { font-size: .6875rem; color: var(--surface-muted-foreground, inherit); opacity: .9; }
      .pct { font-variant-numeric: tabular-nums; }
      .pct-warning { color: var(--status-warning, var(--warning, #d9822b)); }
      .pct-error { color: var(--status-error, var(--destructive, #d33)); }
      .muted { opacity: .7; }
      .line { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .error-line { white-space: normal; overflow-wrap: anywhere; }
      .error { color: var(--status-error, var(--destructive, #d33)); opacity: 1; }
      .warning { color: var(--status-warning, var(--warning, #c80)); opacity: 1; }
      .refresh { position: absolute; top: 0; right: 0; border: 0; background: transparent; color: inherit; font: inherit; opacity: .5; cursor: pointer; padding: 0 2px; }
      .refresh:hover { opacity: 1; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="main.js"></script>
  </body>
</html>
