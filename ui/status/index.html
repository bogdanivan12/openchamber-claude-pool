<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Claude Pool</title>
    <style>
      html, body { margin: 0; }
      #root { position: relative; padding: 2px 0; font-size: .85em; }
      .list { display: flex; flex-direction: column; gap: 10px; min-width: 0; padding-right: 1.4em; }
      .row { display: flex; flex-direction: column; gap: 4px; }
      .head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; min-width: 0; }
      .name { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .active { font-weight: 600; }
      .note { flex: none; opacity: .8; }
      .win { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding-left: 1.4em; }
      .win-label { display: flex; gap: .6em; align-items: baseline; opacity: .8; }
      .win-reset { font-size: .85em; opacity: .6; }
      .pct { color: var(--warning, #d9822b); font-variant-numeric: tabular-nums; }
      .muted { opacity: .7; }
      .line { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .error-line { white-space: normal; overflow-wrap: anywhere; }
      .error { color: var(--destructive, #d33); opacity: 1; }
      .warning { color: var(--warning, #c80); opacity: 1; }
      .refresh { position: absolute; top: 0; right: 0; border: 0; background: transparent; color: inherit; font: inherit; opacity: .5; cursor: pointer; padding: 0 2px; }
      .refresh:hover { opacity: 1; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="main.js"></script>
  </body>
</html>
