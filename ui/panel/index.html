<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Claude Pool</title>
    <style>
      /* Everything comes from the host theme; the only accent is the host's primary. */
      :root {
        --cp-fg: var(--surface-foreground, CanvasText);
        --cp-muted: var(--surface-muted-foreground, GrayText);
        --cp-surface: var(--surface-elevated, transparent);
        --cp-line: color-mix(in srgb, var(--cp-fg) 10%, transparent);
        --cp-ok: var(--status-success, #3a7);
        --cp-bad: var(--status-error, #d33);
        --cp-r: var(--radius, 9px);
      }
      *, *::before, *::after { box-sizing: border-box; }
      html, body { margin: 0; }
      #root { padding: 16px 16px 24px; max-width: 640px; margin: 0 auto; }
      h1, h2, p { margin: 0; }
      .page { display: flex; flex-direction: column; gap: 14px; }
      .stack { display: flex; flex-direction: column; gap: 8px; }
      .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      .grow { flex: 1; min-width: 0; }
      .muted { color: var(--cp-muted); }
      .small { font-size: .8125rem; }
      .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
      .page button:active:not(:disabled) { transform: translateY(1px); }

      .header { display: flex; align-items: flex-start; gap: 12px; }
      .title { font-size: 1.0625rem; font-weight: 600; letter-spacing: -0.01em; line-height: 1.3; }
      .summary { font-size: .8125rem; margin-top: 2px; }
      .toolbar { gap: 6px; }
      .section-title { font-size: .8125rem; font-weight: 600; color: var(--cp-muted); margin-top: 4px; }

      /* One surface for every account; rows are split by hairlines, not separate cards. */
      .accounts { border-radius: var(--cp-r); background: var(--cp-surface); box-shadow: inset 0 0 0 1px var(--cp-line); }
      .accounts > .acct + .acct { border-top: 1px solid var(--cp-line); }
      .acct { padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
      .acct.off .who, .acct.off .usage { opacity: .5; }
      .acct-top { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: start; }
      .dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 7px; }
      .dot.use { background: var(--cp-ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--cp-ok) 22%, transparent); }
      .dot.ready { box-shadow: inset 0 0 0 1.5px var(--cp-muted); }
      .dot.out { background: var(--cp-bad); }
      .dot.off { box-shadow: inset 0 0 0 1.5px var(--cp-line); }
      .who { min-width: 0; }
      .name-line { display: flex; align-items: center; gap: 8px; min-width: 0; flex-wrap: wrap; }
      .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .meta { font-size: .8125rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .acct-ctrl { display: flex; align-items: center; gap: 4px; }
      .acct-ctrl .oc-sdk-check-label, .acct-ctrl label { font-size: .8125rem; color: var(--cp-muted); }

      .usage { display: flex; flex-direction: column; gap: 10px; padding-left: 18px; }
      .win { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
      .win-head { display: flex; justify-content: space-between; align-items: baseline; font-size: .8125rem; }
      .win-label { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
      .win-name { color: var(--cp-fg); }
      .pct { font-variant-numeric: tabular-nums; font-weight: 500; }
      .usage .oc-sdk-progress-label { display: none; }
      .usage .oc-sdk-progress-track { height: 4px; }
      .usage .oc-sdk-progress-fill:not([data-tone]) { background: color-mix(in srgb, var(--cp-fg) 55%, transparent); }


      /* Skeleton in the shape of the list */
      .sk { display: block; border-radius: 6px; background: color-mix(in srgb, var(--cp-fg) 8%, transparent); }
      .sk-title { width: 40%; height: 18px; }
      .sk-dot { width: 8px; height: 8px; border-radius: 50%; }
      .sk-line { width: 50%; height: 14px; }
      .sk-bar { height: 18px; }
      @media (prefers-reduced-motion: no-preference) { .sk { animation: cp-pulse 1.4s ease-in-out infinite; } }
      @keyframes cp-pulse { 50% { opacity: .5; } }

      /* Text that can wrap onto several lines is justified; hyphenation keeps the gaps small. */
      .intro, .faq-body p, .oc-sdk-banner-body, .oc-sdk-empty-body, .hint { text-align: justify; text-justify: inter-word; hyphens: auto; -webkit-hyphens: auto; overflow-wrap: break-word; }

      /* Help */
      .intro { line-height: 1.55; max-width: 60ch; }
      .faq { border-radius: var(--cp-r); background: var(--cp-surface); box-shadow: inset 0 0 0 1px var(--cp-line); }
      .faq-item + .faq-item { border-top: 1px solid var(--cp-line); }
      .faq-item summary { cursor: pointer; padding: 11px 14px; font-weight: 500; list-style: none; display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
      .faq-item summary::-webkit-details-marker { display: none; }
      .faq-item summary::after { content: "+"; color: var(--cp-muted); flex: none; transition: transform .15s ease; }
      .faq-item[open] summary::after { transform: rotate(45deg); }
      .faq-body { padding: 0 14px 12px; display: flex; flex-direction: column; gap: 8px; line-height: 1.55; color: color-mix(in srgb, var(--cp-fg) 85%, transparent); max-width: 64ch; }

      /* Inline flows keep the list's surface */
      .page > .acct { border-radius: var(--cp-r); background: var(--cp-surface); box-shadow: inset 0 0 0 1px var(--cp-line); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="main.js"></script>
  </body>
</html>
